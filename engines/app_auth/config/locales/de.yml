      Ihre aktuelle Sitzung konnte nicht geladen werden. Laden Sie diese Seite neu und versuchen Sie es erneut.
      Wenn das Problem weiterhin besteht, stellen Sie sicher, dass Sitzungs-Cookies in Ihrem Browser aktiviert sind.

    encryption_phrase_description: |-
      Bitte geben Sie eine Verschlüsselungs-PIN für Ihr Konto an. Diese PIN ist kein Passwort:
      sie wird nur für die Verschlüsselung verwendet, nicht für die Anmeldung.
    encryption_phrase: Verschlüsselungs-PIN
    #
    # Credentials
    #
    credentials:
      index:
        log_in: "Anmeldedaten"
        add_passkey: "Passkey hinzufügen"
        add_recovery: "Wiederherstellungscode hinzufügen"
        active_sessions: "Aktive Sitzungen"
        auth_history: "Authentifizierungsverlauf"
        created: "Erstellt"
        last_seen: "Zuletzt gesehen"
        credential: "Anmeldedaten"
        user_agent: "Benutzeragent"
        when: "Wann"
        success: "Erfolg"
        failure: "Fehlschlag"
      list:
        name: "Name"
        registered: "Registriert"
        encryption: "Verschlüsselung"
      edit:
        title: "Passkey hinzufügen"
        authentication: "Authentifizierung"

      # all i18n keys for navigation moved to nav.*
      recovery_intro: |-
        Bitte notieren Sie den folgenden Wiederherstellungscode. Sie werden keine weitere Gelegenheit haben,
        diesen Code zu sehen. Damit können Sie auf Ihr Konto zugreifen, auch ohne Passkey oder Sicherheitsschlüssel.
      encryption_prf_intro: |-
        Ihr Passkey unterstützt automatische Verschlüsselung. Wenn Sie auf "Verschlüsselung aktivieren" klicken,
        werden Sie aufgefordert, Ihren Passkey erneut zu bestätigen.

    #
    # Sessions
    #
    sessions:

