    #
    # Recovery
    #
    recovery:
      intro: "Geben Sie Ihren Wiederherstellungscode ein. Der Wiederherstellungscode unterscheidet nicht zwischen Groß- und Kleinschreibung. Bindestriche und Leerzeichen werden ignoriert."
      cancel: "Abbrechen"
      log_in: "Anmelden"

    #
