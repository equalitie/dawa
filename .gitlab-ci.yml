stages:
  - image
  - test
  - build

variables:
  STORAGE_DRIVER: vfs
  PLATFORM: linux/amd64
  GIT_DEPTH: "1"
  RUBY_VERSION: "3.4.4"

# The image `test` runs in. Building it here bakes in the apt packages the suite needs,
# instead of installing them on every pipeline. See container/test/Dockerfile and
# docs/ci-cd.md.
build-test-base:
  stage: image

  tags:
    - docker

  variables:
    TEST_IMAGE: "${CI_REGISTRY}/${HARBOR_PROJECT}/${CI_PROJECT_NAME}-test-base"

  # Rebuild only when the image's inputs change: the Dockerfile, or RUBY_VERSION (which
  # selects the base tag). The manual clause is the default-branch escape hatch after an
  # upstream change such as a Debian security update.
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - container/test/Dockerfile
        - .gitlab-ci.yml
    - if: $CI_COMMIT_BRANCH
      changes:
        - container/test/Dockerfile
        - .gitlab-ci.yml
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: manual
      allow_failure: true

  before_script:
    - printf '%s' "$CI_REGISTRY_PASSWORD" | buildah login --username "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"

  script:
    # Tag by image content, not by commit, so unchanged images keep the same tag. RUBY_VERSION
    # is hashed too, so a base image bump invalidates it.
    - |
      TEST_TAG="$( { cat container/test/Dockerfile; printf '\n%s\n' "$RUBY_VERSION"; } \
        | sha256sum | cut -c1-12 )"
      echo "Test image content tag: $TEST_TAG"

    # --layers keeps each image layer and --cache-from/--cache-to are what make the registry hold the layers.
    - |
      buildah build \
        --platform="$PLATFORM" \
        --layers \
        --cache-from "$TEST_IMAGE" \
        --cache-to "$TEST_IMAGE" \
        --build-arg "RUBY_VERSION=${RUBY_VERSION}" \
        -t "$TEST_IMAGE:$TEST_TAG" \
        -f container/test/Dockerfile container/test

    - |
      if buildah manifest exists "$TEST_IMAGE:$TEST_TAG" 2>/dev/null; then
        echo "$TEST_IMAGE:$TEST_TAG already exists; skipping push"
      else
        buildah push "$TEST_IMAGE:$TEST_TAG"
      fi

    # `test` cannot compute the content tag (see docs/ci-cd.md), so it pulls this.
    - buildah tag "$TEST_IMAGE:$TEST_TAG" "$TEST_IMAGE:latest"
    - buildah push "$TEST_IMAGE:latest"

test:
  stage: test
  timeout: 30m
  # `latest` because `image:` is expanded before any script runs. See docs/ci-cd.md.
  image: "${CI_REGISTRY}/${HARBOR_PROJECT}/${CI_PROJECT_NAME}-test-base:latest"
  variables:
    BUNDLE_CACHE: "${CI_PROJECT_DIR}/vendor/bundle"
  cache:
    key:
      files:
        - "**/Gemfile.lock"
        - "**/*.gemspec"
    paths:
      - "${BUNDLE_CACHE}"
  before_script:
    - bundle config path "$BUNDLE_CACHE"
    - bundle install --jobs 4 --retry 3
    - |
      for dir in engines/* gems/*; do
        if [ -f "$dir/Gemfile" ]; then
          echo "bundle install in $dir"
          (cd "$dir" && bundle install --jobs 4 --retry 3)
        fi
      done
  script:
    - bin/rails db:prepare
    - rake test:all
  artifacts:
    when: on_failure
    paths:
      - log/
      - tmp/
    exclude:
      - tmp/cache/*
    expire_in: 1 week

build-image:
  stage: build

  tags:
    - docker

  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/

  before_script:
    - printf '%s' "$CI_REGISTRY_PASSWORD" | buildah login --username "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"

  script:
    - HARBOR_IMAGE="${CI_REGISTRY}/${HARBOR_PROJECT}/${CI_PROJECT_NAME}"
    - IMAGE="$HARBOR_IMAGE:$CI_COMMIT_SHORT_SHA"
    - echo "Building $IMAGE for $PLATFORM"

    # Tagged by commit hash. The cache flags keep the two apt layers and bundle install from
    # re-running on every push to the default branch.
    - |
      if buildah manifest exists "$HARBOR_IMAGE:latest" 2>/dev/null; then
        CACHE_FROM="--cache-from $HARBOR_IMAGE"
      else
        CACHE_FROM=""
      fi
    - |
      buildah build \
        --platform="$PLATFORM" \
        --layers \
        $CACHE_FROM \
        --cache-to "$HARBOR_IMAGE" \
        --build-arg "VERSION=$CI_COMMIT_SHORT_SHA" \
        -t "$IMAGE" .
    - buildah push "$IMAGE"

    # Tagged by :latest, on the default branch only
    - |
      if [ "$CI_COMMIT_BRANCH" = "$CI_DEFAULT_BRANCH" ]; then
        echo "Tagging as $HARBOR_IMAGE:latest"
        buildah tag "$IMAGE" "$HARBOR_IMAGE:latest"
        buildah push "$HARBOR_IMAGE:latest"
      fi

    # Tagged by semver git tag, when the commit has one
    - |
      if [ -n "$CI_COMMIT_TAG" ] && printf '%s' "$CI_COMMIT_TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
        echo "Tagging as $HARBOR_IMAGE:$CI_COMMIT_TAG"
        buildah tag "$IMAGE" "$HARBOR_IMAGE:$CI_COMMIT_TAG"
        buildah push "$HARBOR_IMAGE:$CI_COMMIT_TAG"
      fi
