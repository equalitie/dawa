name: dawa_demo

services:
  dawa:
    image: dawa
    container_name: dawa
    ports:
      - "127.0.0.1:3000:3000"
    labels:
      - "dc_app=internal"
    expose:
      - 3000
    environment:
      - RAILS_ENV=production
      - RAILS_LOG_LEVEL=debug
      - DEMO=true
      - DOCKER_URL=http://docker-proxy:2375
      - METRICS_URL=http://victoriametrics:8428
      - LOGS_URL=http://victorialogs:9428
      - PUBLIC_PROTOCOL=http
      - SITE_TITLE
      - SITE_DOMAIN
      - SECRET_KEY_BASE
      - SALT
      - OPENID_PRIVATE_KEY
    volumes:
      - dawa_storage:/rails/storage
    deploy:
      resources:
        limits:
          cpus: 1
          memory: 1GB

  ##
  ## DOCKER
  ##

  # Proxy for docker api access
  # Services needing docker api should connect to tcp://docker-proxy:2375
  # For rootless with podman, see: https://github.com/linuxserver/docker-socket-proxy
  docker-proxy:
    image: lscr.io/linuxserver/socket-proxy:latest
    container_name: docker-proxy
    labels:
      - "dc_app=internal"
    expose:
      - 2375
    environment:
      CONTAINERS: 1
      IMAGES: 1
      POST: 1
      DELETE: 1
      INFO: 1
      VERSION: 1
      ALLOW_LOGS: 1
      # debug, info, notice, warning, err, crit, alert and emerg. defaults to info.
      LOG_LEVEL: info
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    read_only: true
    tmpfs:
      - /tmp
      - /run
    group_add:
      - "${DOCKER_GID:-984}"

  ##
  ## METRICS
  ##

  # exports container metrics with support for labels
  logporter:
    image: lifailon/logporter:latest
    container_name: logporter
    labels:
      - "dc_app=internal"
    restart: always
    expose:
      - 9333
    environment:
      LOG_LEVEL: info
      DOCKER_HOST: tcp://docker-proxy:2375
      DOCKER_METRICS_PORT: 9333
      DOCKER_METRICS_CUSTOM_LABELS: "dc_app,dc_version,dc_inst,dc_env"
    depends_on:
      - docker-proxy

  # time series metrics database
  victoriametrics:
    image: victoriametrics/victoria-metrics:latest
    container_name: victoriametrics
    labels:
      - "dc_app=internal"
    restart: unless-stopped
    expose:
      - 8428
    volumes:
      - metrics_storage:/victoria-metrics-data
      - ./promscrape.yml:/etc/vm/promscrape.yml:ro
    command:
      - '-storageDataPath=/victoria-metrics-data'
      - '-retentionPeriod=3M'
      - '-promscrape.config=/etc/vm/promscrape.yml'
      - '-httpListenAddr=:8428'
      - '-memory.allowedPercent=60'
      - '-search.maxQueryDuration=30s'
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:8428/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  ##
  ## LOGS
  ##

  # vector is an all-in-one log/metric/trace pipeline processor.
  # we use it to feed logs to victorialogs and metrics to victoriametrics.
  vector:
    # image: timberio/vector:latest-alpine << if you need to debug with exec sh
    image: timberio/vector:latest-distroless-static
    container_name: vector
    labels:
      - "dc_app=internal"
    volumes:
      - ./vector.yml:/etc/vector/vector.yaml:ro
      # To access Docker logs
      - /var/run/docker.sock:/var/run/docker.sock:ro
      # To access host logs
      - /var/log:/var/log:ro
      # Provides process and system statistics
      - /proc:/host/proc:ro
      # Provides device and driver information
      - /sys:/host/sys:ro
      # Provides the root filesystem for disk usage metrics
      - /:/host:ro
    depends_on:
      - victorialogs
      - victoriametrics
      - logporter
    restart: unless-stopped

  # centralized log database
  victorialogs:
    image: victoriametrics/victoria-logs:latest
    container_name: victorialogs
    labels:
      - "dc_app=internal"
    expose:
      - 9428
    volumes:
      - log_storage:/victoria-logs-data
    command:
      - "-storageDataPath=/victoria-logs-data"
      - "-retentionPeriod=14d"
      - "-httpListenAddr=:9428"
    restart: unless-stopped

volumes:
  dawa_storage:
  log_storage:
  metrics_storage:
