#
# Do not edit this file. These defaults can be overridden with ENV variables or
# with a file `config/config.yml`.
#
# The ENV variable is the same as the values in this file, but all caps.
#

variables:
  site_title: string required
  site_domain: domain required
  salt: hex required
  db_password: string required

#
# common default settings for all environments
#
defaults:
  public_protocol: https
  private_protocol: http

  site_title: ~
  site_domain: ~
  site_public_url: "${public_protocol}://${site_domain}"
  site_private_url: "${private_protocol}://dawa:3000"
  websocket_url: ws://localhost:1234/

  db_port: 5432
  db_host: localhost
  db_user: dawa
  db_name: dawa
  db_password: ~

  # timezone must be a string recognized by ActiveSupport::TimeZone[]
  # see https://api.rubyonrails.org/classes/ActiveSupport/TimeZone.html
  default_timezone: "Mountain Time (US & Canada)"

  # the name of the session id in the cookie
  session_key: id

development:
  demo: true
  site_title: "Dawa"
  site_domain: localhost
  public_protocol: http
  site_public_url: http://localhost:3000
  site_private_url: http://host.docker.internal:3000
  salt: "46006f16af1ff1656e199decf4c3813359ef2b4220dff2bfd65ed69d362a678a"
  db_name: dawa_development
  db_password: my_db_password

test:
  demo: true
  site_title: "Test"
  site_domain: localhost
  public_protocol: http
  site_public_url: http://localhost:3000
  salt: "686774987296de6f62004b691365d0e765acbf01ad7817c43eab3c7c23cde4c3"
  jwt_secret: my_jwt_secret
  db_name: dawa_test
  db_password: my_db_password

production:
  site_public_url: "${public_protocol}://${site_domain}"
  site_private_url: "${private_protocol}://dawa:${app_port}"
  websocket_url: "wss://${site_domain}"
  app_port: 3000
