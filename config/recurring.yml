# examples:
#   periodic_cleanup:
#     class: CleanSoftDeletedRecordsJob
#     queue: background
#     args: [ 1000, { batch_size: 500 } ]
#     schedule: every hour
#   periodic_cleanup_with_command:
#     command: "SoftDeletedRecord.due.delete_all"
#     priority: 2
#     schedule: at 5am every day

production:
  clear_solid_queue_finished_jobs:
    command: "SolidQueue::Job.clear_finished_in_batches(sleep_between_batches: 0.3)"
    schedule: every hour at minute 12

  # Purge Auth sessions that are idle past the configured idle timeout or older than the max
  # session lifetime (see Auth.user_session_idle_timeout / Auth.user_session_max_lifetime).
  session_cleanup:
    class: Auth::SessionJob
    schedule: "0 * * * *"
