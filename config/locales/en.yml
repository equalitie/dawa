  #
  # Apps. One flat prefix covers both the catalog (what CAN be installed) and installed
  # apps (what IS installed), because they are two views of the same concept and are
  # always read together.
  #
  apps:
    # the apps index (installed apps)
    install: "Install"
    install_application: "Install Application"
    name: "Name"
    version: "Version"
    version_unknown: "Unknown"
    version_number: "Version %{version}"
    domain: "Domain"
    domain_unknown: "Unknown"
    instance_id: "Instance ID"
    index:
      title: "Apps"
      empty: "No apps are installed yet."
    status:
      # actual statuses
      running: "Running"
      stopped: "Stopped"
      # synthetic & buttons
      start: "Start"
      stop: "Stop"
      restart: "Restart"
      starting: "Starting"
      stopping: "Stopping"
      restarting: "Restarting"
      unknown: "Unknown"
    # The catalog entry an instance was created from (the appdef id).
    app: "App"
    catalog_entry: "Catalog entry"

    state:
      # Shown when a command finishes for an instance `inst/list` no longer reports: someone removed
      # it while the command ran, so there is no state left to describe.
      gone: "%{name} is no longer reported by dcommsctl, so its state is unknown."
      timeout: >-
        We stopped waiting for this command. It may still be running; reload the page to see
        the current state.
      # A restart is a stop and then a start. This is the second half timing out, which is
      # different from the generic timeout because the stop already succeeded: the instance is
      # down, not merely unconfirmed.
      restart_timeout: >-
        The instance was stopped, but we stopped waiting for it to start again. Reload the
        page to see the current state.

    #
    # Uninstalling one app. "Remove" throughout rather than "uninstall", so the wording matches
    # what the action does: the daemon takes the containers down and keeps the app's data (see
    # scope_body).
    #
    # Confirming is typing the instance name, so the strings name the instance back to the user;
    # `name_mismatch` is what a rejected attempt (or a typo) is told.
    #
    uninstall:
      action: "Remove"
      title: "Remove App"
      heading: "Remove %{name}"
      domain: "This instance serves %{domain}."
      domain_unknown: "This instance's domain is not recorded."
      confirm: "Remove"
      field_label: "Type %{name} to confirm"
      name_mismatch: "That does not match %{name}. Type the app's full name to continue."
      not_installed: "This app is no longer installed, so there is nothing to remove."
      # Reported after the daemon has accepted the job. It does NOT claim the app is gone: the
      # removal is asynchronous and Dawa does not follow it (see AppsController#destroy).
      started: >-
        Removing %{name}. This runs in the background, so the app may take a moment to
        disappear from the list.
      # Spelled out because the daemon's uninstall is narrower than the word suggests.
      scope_title: "What this does"
      scope_body: >-
        The app's containers are stopped and removed. Its data is kept, so the app can be
        installed again with the same data still on disk.

    # the catalog index (installable entries)
    catalog_empty: "No installable apps were found in the catalog."
    catalog_unreachable: "Could not reach dcommsctl"
    catalog_updated: "Updated %{date}"
    catalog_about: "About"
    catalog_links: "Links"
    catalog_releases: "Releases"
    upstream_project: "Upstream project"
    app_definition: "App definition"
    latest: "Latest"
    date_unknown: "Date unknown"
    no_releases: "No releases have been published for this app."
    not_provided: "Not provided"
    install_not_wired: "Installing is not available yet"

