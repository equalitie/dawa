  jobs:
    title: "Jobs"
    none: "No jobs have been run for this app yet."
    # Shown when the list is capped; the count is the TOTAL, so the operator knows how many
    # there are before deciding to open the full list.
    show_all: "Show all %{count} jobs"
    # table columns
    action: "Action"
    state_label: "State"
    started: "Started"
    outcome: "Outcome"
    # job states (dcommsctl JobState)
    state:
      pending: "Pending"
      running: "Running"
      done: "Done"
      failed: "Failed"
    # Standalone install-job summaries, distinct from the daemon's own states: this adds
    # `timeout`, which a JobStatus cannot report.
    install:
      running: "Installing"
      succeeded: "Installed"
      failed: "Failed"
      timeout: "Still running"
      timeout_hint: "Dawa stopped following this job. It may still be running; check the app's page."
      status_unknown: "The job is no longer known to dcommsctl."
    # job types are the daemon's own words (install, start, backup, ...). Shown as sent;
    # this is the fallback when the daemon sends no type at all.
    type_unknown: "Unknown"
    time_unknown: "Unknown"
    in_progress: "In progress"
    duration: "Took %{duration}"
